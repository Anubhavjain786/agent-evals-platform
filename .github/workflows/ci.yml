name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 11 resolves this dependency graph reliably and honours allowScripts.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm run build -w @agent-evals/shared
      - run: npm run check
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-evals:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
